name: rosen-release

# Tag vX.Y.Z.postN on rosen/main -> test, build wheel, publish GitHub Release, refresh the extension index.
on:
  push:
    tags: ['v*.post*']

permissions:
  contents: write
  actions: write

jobs:
  test:
    uses: ./.github/workflows/rosen-ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag matches version.py
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' azure-devops/azext_devops/version.py)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - name: Build wheel
        working-directory: azure-devops
        run: python -m pip wheel . --no-deps -w ../dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl --title "$GITHUB_REF_NAME" \
            --notes "ROSEN fork of azure-devops. See ROSEN-FORK.md for install and update instructions."
      - name: Refresh extension index
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rosen-index.yml --ref rosen/main
